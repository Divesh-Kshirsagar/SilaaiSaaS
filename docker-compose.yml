services:
  postgres:
    image: postgres:16-alpine
    container_name: silaaisaas_db
    environment:
      POSTGRES_DB: silaaisaas
      POSTGRES_USER: silaai
      POSTGRES_PASSWORD: silaai_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silaai -d silaaisaas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
