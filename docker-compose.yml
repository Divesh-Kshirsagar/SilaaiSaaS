services:
  postgres:
    image: postgres:16-alpine
    container_name: silaaisaas_db
    environment:
      POSTGRES_DB: silaaisaas
      POSTGRES_USER: silaai
      POSTGRES_PASSWORD: silaai_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silaai -d silaaisaas"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    container_name: silaaisaas_api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/silaaisaas
      DB_USERNAME: silaai
      DB_PASSWORD: silaai_dev
      JWT_SECRET: replace-with-32-char-minimum-secret-key
      JWT_EXPIRY_MS: 86400000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8100
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: ./apps/app
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    container_name: silaaisaas_app
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
