spring:
  application:
    name: silaaisaas-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/silaaisaas}
    username: ${DB_USERNAME:silaai}
    password: ${DB_PASSWORD:silaai_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # TODO: Replace with Flyway migrations before any production deployment.
      # See: https://flywaydb.org/documentation/usage/api/
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    # Disable default Spring Security password generation in console
    user:
      password: disabled

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-replace-in-production-must-be-32-chars-min}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8100}

logging:
  level:
    com.silaaisaas: DEBUG
    org.springframework.security: INFO
